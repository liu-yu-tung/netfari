<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Netfari</title>
    <style>
      :root {
        --bg: #fff;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --line: #d2d2d7;
        --accent: #e50914;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #f5f5f7;
          --muted: #a1a1a6;
          --line: #3a3a3c;
        }
      }
      body {
        margin: 0;
        width: 260px;
        padding: 12px 14px 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px -apple-system, "Helvetica Neue", sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 10px 0;
      }
      label {
        color: var(--muted);
      }
      select,
      input[type="range"] {
        width: 150px;
      }
      .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
      }
      .switch input {
        accent-color: var(--accent);
        width: 18px;
        height: 18px;
      }
      #status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
        min-height: 1em;
      }
      #hint {
        color: var(--muted);
        font-size: 11px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Netfari</h1>
    <div class="switch">
      <span>Secondary subtitles</span>
      <input type="checkbox" id="enabled" />
    </div>
    <div class="row">
      <label for="lang">Language</label>
      <select id="lang"></select>
    </div>
    <div class="row">
      <label for="position">Position</label>
      <select id="position">
        <option value="top">Top</option>
        <option value="bottom">Bottom (above Netflix subs)</option>
      </select>
    </div>
    <div class="row">
      <label for="size">Size</label>
      <input type="range" id="size" min="2" max="8" step="0.5" />
    </div>
    <div id="status"></div>
    <div id="hint">Shortcut: Option+S on the Netflix page.</div>
    <script src="popup.js"></script>
  </body>
</html>
